name: Official image archive scanner diagnostic (no model)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frozen-node-failed-tasks
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.1'
      - name: Download frozen runtime
        env:
          BEST_AGENT_SOURCE_TOKEN: ${{ secrets.BEST_AGENT_SOURCE_TOKEN }}
        run: node scripts/download-node-bundle.mjs "$RUNNER_TEMP/frozen-node-candidate"
      - name: Reproduce archive inspection without model or provider
        run: |
          mkdir "$RUNNER_TEMP/scan-evidence"
          "$RUNNER_TEMP/frozen-node-candidate/node-v24.15.0-linux-x64/bin/node" scripts/node-bundle-scan-diagnostic.mjs "$RUNNER_TEMP/frozen-node-candidate" "$RUNNER_TEMP/scan-evidence"
      - name: Upload diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scan-evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
