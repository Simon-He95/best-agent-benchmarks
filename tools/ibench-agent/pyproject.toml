[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibench-best-agent"
version = "0.2.0"
description = "Harbor installed-agent plugin driving the pinned best-agent CLI inside IBench task containers."
requires-python = ">=3.12"
dependencies = ["harbor==0.23.0"]

[tool.hatch.build.targets.wheel]
packages = ["ibench_best_agent"]
