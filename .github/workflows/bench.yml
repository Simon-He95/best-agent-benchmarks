name: Benchmark

on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: Run the headless composition smoke gate
        required: false
        type: boolean
        default: true
      run_swe_bench:
        description: Generate frozen SWE-bench Verified predictions
        required: false
        type: boolean
        default: false
      swe_bench_limit:
        description: Number of tasks after offset (0 = all)
        required: false
        default: "1"
      swe_bench_offset:
        description: Skip the first N corpus tasks
        required: false
        default: "0"
      swe_bench_batch:
        description: Immutable diagnostic batch label
        required: false
        default: "diagnostic"
      swe_bench_tasks:
        description: Predeclared comma-separated instance IDs; overrides offset/limit
        required: false
        default: ""
      swe_bench_concurrency:
        description: Parallel model attempts
        required: false
        default: "1"
      swe_bench_model:
        description: Model override; empty uses the repository secret
        required: false
        default: ""
      rerun_beta9_failures:
        description: Run all 302 beta.8 non-resolved tasks in tracked batches of at most 10
        required: false
        type: boolean
        default: false
      run_full_verified:
        description: Run one frozen attempt for all 500 SWE-bench Verified tasks in tracked batches of 5
        required: false
        type: boolean
        default: false
      swe_bench_timeout:
        description: Per-task timeout in milliseconds
        required: false
        default: "1800000"

concurrency:
  group: benchmark-${{ inputs.swe_bench_batch || 'default' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  BENCHMARK_PROVIDER_API_KEY: ${{ secrets.BENCHMARK_PROVIDER_API_KEY }}

jobs:
  plan:
    name: Freeze task batches
    if: ${{ inputs.run_swe_bench }}
    needs: corpus
    runs-on: macos-15
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the frozen corpus
        uses: actions/download-artifact@v4
        with:
          name: swe-bench-corpus-${{ github.run_id }}
          path: results/corpora

      - name: Build bounded matrix
        id: plan
        env:
          RERUN_BETA9_FAILURES: ${{ inputs.rerun_beta9_failures }}
          RUN_FULL_VERIFIED: ${{ inputs.run_full_verified }}
          BATCH_LABEL: ${{ inputs.swe_bench_batch }}
          TASK_IDS: ${{ inputs.swe_bench_tasks }}
          TASK_LIMIT: ${{ inputs.swe_bench_limit }}
          TASK_OFFSET: ${{ inputs.swe_bench_offset }}
          TASK_CONCURRENCY: ${{ inputs.swe_bench_concurrency }}
          MODEL_OVERRIDE: ${{ inputs.swe_bench_model }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const corpusRows = fs.readFileSync("./results/corpora/swe-bench-verified.jsonl", "utf8")
            .trim()
            .split("\n")
            .map(line => JSON.parse(line));
          const corpusIds = corpusRows.map(row => row.instance_id);
          const corpusIdSet = new Set(corpusIds);
          if (corpusIds.length !== 500 || corpusIdSet.size !== corpusIds.length) {
            throw new Error("Frozen corpus must contain exactly 500 unique tasks.");
          }
          const rerunBeta9Failures = process.env.RERUN_BETA9_FAILURES === "true";
          const runFullVerified = process.env.RUN_FULL_VERIFIED === "true";
          if (rerunBeta9Failures && runFullVerified) {
            throw new Error("Select either the beta.9 diagnostic rerun or the full Verified run, not both.");
          }
          if (runFullVerified) {
            const candidate = require("./config/best-agent-candidate.json");
            const override = (process.env.MODEL_OVERRIDE ?? "").trim();
            if (override !== "" && override !== candidate.provider?.model) {
              throw new Error("Full Verified runs must pin the candidate provider model.");
            }
            if (candidate.formalBenchmarkReady !== true) {
              throw new Error("The pinned candidate has not passed the formal benchmark fairness gates.");
            }
          }
          let batches;
          if (rerunBeta9Failures || runFullVerified) {
            const manifest = require(
              runFullVerified
                ? "./config/swe-bench-full-batches.json"
                : "./config/beta9-failure-rerun-batches.json",
            );
            const candidate = require("./config/best-agent-candidate.json");
            if (rerunBeta9Failures && manifest.candidateVersion !== candidate.cliVersion) {
              throw new Error("Failure plan candidate does not match the CLI candidate.");
            }
            const taskIds = manifest.batches.flatMap(batch => batch.tasks);
            if (
              !Number.isInteger(manifest.maxBatchSize) ||
              manifest.maxBatchSize < 1 ||
              manifest.maxBatchSize > 10 ||
              taskIds.length !== manifest.taskCount ||
              new Set(taskIds).size !== taskIds.length ||
              manifest.batches.some(
                batch =>
                  !/^[a-zA-Z0-9._-]+$/.test(batch.id) ||
                  batch.tasks.length < 1 ||
                  batch.tasks.length > manifest.maxBatchSize,
              )
            ) {
              throw new Error("Tracked plan must be a unique, complete set of batches capped at 10 tasks.");
            }
            if (taskIds.some(taskId => !corpusIdSet.has(taskId))) {
              throw new Error("Tracked plan contains a task outside the frozen corpus.");
            }
            if (runFullVerified) {
              const profile = require("./config/swe-bench-verified.json");
              if (
                manifest.profileId !== profile.profileId ||
                manifest.corpusSha256 !== profile.jsonlSha256 ||
                manifest.taskCount !== profile.taskCount ||
                taskIds.some((taskId, index) => taskId !== corpusIds[index])
              ) {
                throw new Error("Full plan must exact-cover the frozen corpus in corpus order.");
              }
            }
            batches = manifest.batches.map((batch, shard) => ({
              id: batch.id,
              tasks: batch.tasks.join(","),
              limit: batch.tasks.length,
              offset: 0,
              concurrency: 1,
              shard,
              shardTotal: manifest.batches.length,
            }));
          } else {
            const id = process.env.BATCH_LABEL ?? "";
            if (!/^[a-zA-Z0-9._-]+$/.test(id)) {
              throw new Error("Batch label must be filesystem-safe.");
            }
            const taskIds = (process.env.TASK_IDS ?? "")
              .split(",")
              .map(value => value.trim())
              .filter(Boolean);
            const limit = Number(process.env.TASK_LIMIT);
            const count = taskIds.length || limit;
            const concurrency = Number(process.env.TASK_CONCURRENCY);
            if (!Number.isInteger(count) || count < 1 || count > 10) {
              throw new Error("Each workflow run must preselect between 1 and 10 tasks.");
            }
            if (new Set(taskIds).size !== taskIds.length) throw new Error("Task IDs must be unique.");
            if (taskIds.some(taskId => !corpusIdSet.has(taskId))) {
              throw new Error("Predeclared task is outside the frozen corpus.");
            }
            if (!Number.isInteger(concurrency) || concurrency < 1 || concurrency > 2) {
              throw new Error("Task concurrency must be 1 or 2.");
            }
            const offset = Number(process.env.TASK_OFFSET);
            if (!Number.isInteger(offset) || offset < 0 || offset + count > corpusIds.length) {
              throw new Error("Task offset/limit must stay inside the frozen corpus.");
            }
            batches = [{
              id,
              tasks: taskIds.join(","),
              limit,
              offset,
              concurrency,
              shard: 0,
              shardTotal: 1,
            }];
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `batches=${JSON.stringify(batches)}\n`);
          NODE

  smoke:
    name: macOS headless smoke
    if: ${{ inputs.run_smoke || inputs.run_swe_bench }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install benchmark dependencies and the exact CLI candidate
        run: |
          npm ci
          CLI_VERSION="$(node -p 'require("./config/best-agent-candidate.json").cliVersion')"
          CLI_PACKAGE="$(node -p 'require("./config/best-agent-candidate.json").packageName')"
          EXPECTED_INTEGRITY="$(node -p 'require("./config/best-agent-candidate.json").packageIntegrity')"
          test "$(uname -m)" = "arm64"
          test "$(npm view "${CLI_PACKAGE}@${CLI_VERSION}" dist.integrity)" = "$EXPECTED_INTEGRITY"
          npm install --no-save --ignore-scripts "${CLI_PACKAGE}@${CLI_VERSION}"
          echo "BEST_AGENT_CLI_PATH=${GITHUB_WORKSPACE}/node_modules/${CLI_PACKAGE}/bin/best-agent" >> "$GITHUB_ENV"

      - name: Verify provider credential
        run: test -n "$BENCHMARK_PROVIDER_API_KEY"

      - name: Materialize the frozen provider identity
        run: node scripts/materialize-ci-provider.mjs "$RUNNER_TEMP/best-agent-provider" "$GITHUB_ENV" config/best-agent-candidate.json

      - name: Verify formal benchmark controls
        run: node --test --test-name-pattern='^(public benchmark artifacts|configuration paths|repository contains no second|hosted generation|the model workspace|formal generation|full Verified plan|repository instructions|the current candidate)' test/architecture.test.mjs

      - name: Verify exec network isolation
        run: |
          mkdir -p results/gates
          node scripts/sandbox-network-smoke.mjs | tee results/gates/sandbox-network-smoke.json

      - name: Upload sandbox network smoke receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-sandbox-network-smoke-${{ github.run_id }}
          path: results/gates/sandbox-network-smoke.json
          if-no-files-found: warn
          retention-days: 90

      - name: Headless composition smoke
        run: |
          mkdir -p results/gates
          node scripts/smoke.mjs | tee results/gates/headless-smoke.json

      - name: Upload headless smoke receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-headless-smoke-${{ github.run_id }}
          path: results/gates/headless-smoke.json
          if-no-files-found: warn
          retention-days: 90

  corpus:
    name: Freeze SWE-bench corpus
    if: ${{ inputs.run_smoke || inputs.run_swe_bench }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the official evaluator commit
        id: evaluator
        run: node -e "import('./scripts/swe-bench-official-evaluator.mjs').then(m => console.log('commit=' + m.OFFICIAL_EVALUATOR_COMMIT))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: SWE-bench/SWE-bench
          ref: ${{ steps.evaluator.outputs.commit }}
          path: tools/swe-bench-source

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Acquire and verify the frozen corpus once
        run: node scripts/prepare-swe-bench.mjs --evaluator-source "${GITHUB_WORKSPACE}/tools/swe-bench-source"

      - name: Upload frozen corpus
        uses: actions/upload-artifact@v4
        with:
          name: swe-bench-corpus-${{ github.run_id }}
          path: results/corpora/swe-bench-verified.jsonl
          if-no-files-found: error
          retention-days: 7

  isolation:
    name: Verify frozen repository isolation
    if: ${{ inputs.run_smoke || inputs.run_swe_bench }}
    needs: corpus
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the frozen corpus
        uses: actions/download-artifact@v4
        with:
          name: swe-bench-corpus-${{ github.run_id }}
          path: results/corpora

      - name: Verify a real shallow clone closure
        run: |
          mkdir -p results/gates
          node scripts/isolation-smoke.mjs "${GITHUB_WORKSPACE}/results/corpora/swe-bench-verified.jsonl" | tee results/gates/repository-isolation.json

      - name: Upload repository isolation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-repository-isolation-${{ github.run_id }}
          path: results/gates/repository-isolation.json
          if-no-files-found: warn
          retention-days: 90

  swe-bench:
    name: macOS generation (${{ matrix.batch.id }})
    if: ${{ inputs.run_swe_bench }}
    needs: [plan, smoke, corpus, isolation]
    runs-on: macos-15
    timeout-minutes: 480
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the single candidate record
        id: candidate
        run: |
          echo "version=$(node -p 'require("./config/best-agent-candidate.json").cliVersion')" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(node -p 'require("./config/best-agent-candidate.json").sourceCommit')" >> "$GITHUB_OUTPUT"
          node -e "import('./scripts/swe-bench-official-evaluator.mjs').then(m => console.log('evaluator_commit=' + m.OFFICIAL_EVALUATOR_COMMIT))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: SWE-bench/SWE-bench
          ref: ${{ steps.candidate.outputs.evaluator_commit }}
          path: tools/swe-bench-source

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the frozen corpus
        uses: actions/download-artifact@v4
        with:
          name: swe-bench-corpus-${{ github.run_id }}
          path: results/corpora

      - name: Install the search runtime
        run: brew install ripgrep

      - name: Install benchmark dependencies and the exact CLI candidate
        run: |
          npm ci
          CLI_PACKAGE="$(node -p 'require("./config/best-agent-candidate.json").packageName')"
          EXPECTED_INTEGRITY="$(node -p 'require("./config/best-agent-candidate.json").packageIntegrity')"
          test "$(uname -m)" = "arm64"
          test "$(npm view "${CLI_PACKAGE}@${{ steps.candidate.outputs.version }}" dist.integrity)" = "$EXPECTED_INTEGRITY"
          npm install --no-save --ignore-scripts "${CLI_PACKAGE}@${{ steps.candidate.outputs.version }}"
          echo "BEST_AGENT_CLI_PATH=${GITHUB_WORKSPACE}/node_modules/${CLI_PACKAGE}/bin/best-agent" >> "$GITHUB_ENV"
          echo "SWE_BENCH_CANDIDATE_ID=cli-${{ steps.candidate.outputs.version }}-${{ steps.candidate.outputs.source_commit }}" >> "$GITHUB_ENV"

      - name: Materialize the frozen provider identity
        run: node scripts/materialize-ci-provider.mjs "$RUNNER_TEMP/best-agent-provider" "$GITHUB_ENV" config/best-agent-candidate.json

      - name: Prepare pinned SWE-bench Verified corpus
        run: node scripts/prepare-swe-bench.mjs --evaluator-source "${GITHUB_WORKSPACE}/tools/swe-bench-source"

      - name: Resolve effective model
        id: model
        run: |
          MODEL="${{ inputs.swe_bench_model }}"
          if [ -z "$MODEL" ]; then MODEL="$(node -p 'require("./config/best-agent-candidate.json").provider.model')"; fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Generate and freeze predictions
        env:
          BEST_AGENT_PROVIDER_MODEL: ${{ steps.model.outputs.model }}
          BATCH_TASKS: ${{ matrix.batch.tasks }}
          SWE_BENCH_EVALUATION_BATCH_ID: ${{ inputs.run_full_verified && format('formal-{0}', github.run_id) || format('cli-{0}-{1}-{2}', steps.candidate.outputs.version, matrix.batch.id, steps.model.outputs.model) }}
          SWE_BENCH_FORMAL_RUN_ID: ${{ inputs.run_full_verified && format('formal-{0}', github.run_id) || format('diagnostic-{0}', github.run_id) }}
        run: |
          ARGS=(
            --generation-only
            --official-manifest "${GITHUB_WORKSPACE}/.tmp/official-evaluator-manifest.json"
            --corpus "${GITHUB_WORKSPACE}/results/corpora/swe-bench-verified.jsonl"
            --limit "${{ matrix.batch.limit }}"
            --offset "${{ matrix.batch.offset }}"
            --concurrency "${{ matrix.batch.concurrency }}"
            --timeout "${{ inputs.swe_bench_timeout }}"
            --shard "${{ matrix.batch.shard }}"
            --shard-total "${{ matrix.batch.shardTotal }}"
            --output "${GITHUB_WORKSPACE}/results/swe-bench-results.shard-${{ matrix.batch.shard }}.json"
          )
          if [ -n "$BATCH_TASKS" ]; then
            ARGS+=(--tasks "$BATCH_TASKS")
          fi
          node scripts/swe-bench-harness.mjs "${ARGS[@]}"

      - name: Upload immutable generation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swe-bench-generation-${{ matrix.batch.id }}
          path: |
            results/swe-bench-results.*.json
            results/swe-bench-results.*.md
            results/swe-bench-results.*.predictions/**
            results/swe-bench-results.*.tasks/**
          if-no-files-found: error
          retention-days: 90

  swe-bench-recovery-plan:
    name: Build benchmark recovery plan
    if: ${{ always() && inputs.run_full_verified }}
    needs: [plan, smoke, corpus, isolation, swe-bench]
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      has_recovery: ${{ steps.recovery.outputs.has_recovery }}
      batches: ${{ steps.recovery.outputs.batches }}
      manifest_sha256: ${{ steps.recovery.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download original generation artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: swe-bench-generation-*
          path: results
          merge-multiple: true

      - name: Download the frozen corpus
        uses: actions/download-artifact@v4
        with:
          name: swe-bench-corpus-${{ github.run_id }}
          path: results/corpora

      - name: Download formal gates
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*-${{ github.run_id }}
          path: results/gates
          merge-multiple: true

      - name: Capture completed source job conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=all&per_page=100" > "$RUNNER_TEMP/job-pages.json"
          node -e 'const fs=require("fs");const pages=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));fs.writeFileSync(process.argv[2],JSON.stringify({jobs:pages.flatMap(page=>page.jobs)},null,2)+"\n")' "$RUNNER_TEMP/job-pages.json" "${GITHUB_WORKSPACE}/results/github-jobs.json"

      - name: Freeze evaluator-blind recovery manifest
        id: recovery
        run: |
          node scripts/plan-recovery.mjs \
            --results "${GITHUB_WORKSPACE}/results" \
            --plan "${GITHUB_WORKSPACE}/config/swe-bench-full-batches.json" \
            --corpus "${GITHUB_WORKSPACE}/results/corpora/swe-bench-verified.jsonl" \
            --output "${GITHUB_WORKSPACE}/results/recovery-plan.json"
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const plan = JSON.parse(fs.readFileSync("results/recovery-plan.json", "utf8"));
          const batches = plan.batches.map(batch => ({
            ...batch,
            taskList: batch.tasks.join(","),
            limit: batch.tasks.length,
          }));
          const sha256 = crypto.createHash("sha256").update(fs.readFileSync("results/recovery-plan.json")).digest("hex");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_recovery=${batches.length > 0}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `batches=${JSON.stringify(batches)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `manifest_sha256=${sha256}\n`);
          NODE

      - name: Upload immutable recovery decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swe-bench-recovery-plan-${{ github.run_id }}
          path: |
            results/recovery-plan.json
            results/github-jobs.json
          if-no-files-found: error
          retention-days: 90

  swe-bench-recovery:
    name: macOS recovery (${{ matrix.batch.id }})
    if: ${{ needs.swe-bench-recovery-plan.outputs.has_recovery == 'true' }}
    needs: [corpus, swe-bench-recovery-plan]
    runs-on: macos-15
    timeout-minutes: 480
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJSON(needs.swe-bench-recovery-plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the single candidate record
        id: candidate
        run: |
          echo "version=$(node -p 'require("./config/best-agent-candidate.json").cliVersion')" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(node -p 'require("./config/best-agent-candidate.json").sourceCommit')" >> "$GITHUB_OUTPUT"
          node -e "import('./scripts/swe-bench-official-evaluator.mjs').then(m => console.log('evaluator_commit=' + m.OFFICIAL_EVALUATOR_COMMIT))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: SWE-bench/SWE-bench
          ref: ${{ steps.candidate.outputs.evaluator_commit }}
          path: tools/swe-bench-source

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the frozen corpus
        uses: actions/download-artifact@v4
        with:
          name: swe-bench-corpus-${{ github.run_id }}
          path: results/corpora

      - name: Download the frozen recovery manifest
        uses: actions/download-artifact@v4
        with:
          name: swe-bench-recovery-plan-${{ github.run_id }}
          path: results/recovery-plan

      - name: Install the search runtime
        run: brew install ripgrep

      - name: Install benchmark dependencies and the exact CLI candidate
        run: |
          npm ci
          CLI_PACKAGE="$(node -p 'require("./config/best-agent-candidate.json").packageName')"
          EXPECTED_INTEGRITY="$(node -p 'require("./config/best-agent-candidate.json").packageIntegrity')"
          test "$(uname -m)" = "arm64"
          test "$(npm view "${CLI_PACKAGE}@${{ steps.candidate.outputs.version }}" dist.integrity)" = "$EXPECTED_INTEGRITY"
          npm install --no-save --ignore-scripts "${CLI_PACKAGE}@${{ steps.candidate.outputs.version }}"
          echo "BEST_AGENT_CLI_PATH=${GITHUB_WORKSPACE}/node_modules/${CLI_PACKAGE}/bin/best-agent" >> "$GITHUB_ENV"
          echo "SWE_BENCH_CANDIDATE_ID=cli-${{ steps.candidate.outputs.version }}-${{ steps.candidate.outputs.source_commit }}" >> "$GITHUB_ENV"

      - name: Materialize the frozen provider identity
        run: node scripts/materialize-ci-provider.mjs "$RUNNER_TEMP/best-agent-provider" "$GITHUB_ENV" config/best-agent-candidate.json

      - name: Prepare pinned SWE-bench Verified corpus
        run: node scripts/prepare-swe-bench.mjs --evaluator-source "${GITHUB_WORKSPACE}/tools/swe-bench-source"

      - name: Resolve effective model
        id: model
        run: |
          MODEL="${{ inputs.swe_bench_model }}"
          if [ -z "$MODEL" ]; then MODEL="$(node -p 'require("./config/best-agent-candidate.json").provider.model')"; fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Recover only predeclared evidence gaps
        env:
          BEST_AGENT_PROVIDER_MODEL: ${{ steps.model.outputs.model }}
          SWE_BENCH_EVALUATION_BATCH_ID: formal-${{ github.run_id }}
          SWE_BENCH_FORMAL_RUN_ID: formal-${{ github.run_id }}
          SWE_BENCH_RECOVERY_MANIFEST_SHA256: ${{ needs.swe-bench-recovery-plan.outputs.manifest_sha256 }}
        run: |
          mkdir -p results/recovery
          node scripts/swe-bench-harness.mjs \
            --generation-only \
            --official-manifest "${GITHUB_WORKSPACE}/.tmp/official-evaluator-manifest.json" \
            --corpus "${GITHUB_WORKSPACE}/results/corpora/swe-bench-verified.jsonl" \
            --tasks "${{ matrix.batch.taskList }}" \
            --limit "${{ matrix.batch.limit }}" \
            --offset 0 \
            --concurrency 1 \
            --timeout "${{ inputs.swe_bench_timeout }}" \
            --shard "${{ matrix.batch.sourceShard }}" \
            --shard-total 100 \
            --output "${GITHUB_WORKSPACE}/results/recovery/swe-bench-recovery.shard-${{ matrix.batch.sourceShard }}.json"

      - name: Upload immutable recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swe-bench-recovery-${{ matrix.batch.id }}
          path: results/recovery/**
          if-no-files-found: error
          retention-days: 90

  swe-bench-merge:
    name: Admit deferred generation artifacts
    if: ${{ always() && inputs.run_swe_bench }}
    needs: [swe-bench, swe-bench-recovery-plan, swe-bench-recovery]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download generation artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: swe-bench-generation-*
          path: results
          merge-multiple: true

      - name: Download recovery artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: swe-bench-recovery-recovery-*
          path: results/recovery
          merge-multiple: true

      - name: Download the frozen recovery manifest
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: swe-bench-recovery-plan-${{ github.run_id }}
          path: results/recovery-plan

      - name: Download the frozen corpus
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: swe-bench-corpus-${{ github.run_id }}
          path: results/corpora

      - name: Download the headless smoke receipt
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: benchmark-headless-smoke-${{ github.run_id }}
          path: results/gates

      - name: Download the sandbox network smoke receipt
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: benchmark-sandbox-network-smoke-${{ github.run_id }}
          path: results/gates

      - name: Download the repository isolation receipt
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: benchmark-repository-isolation-${{ github.run_id }}
          path: results/gates

      - name: Capture GitHub job and step conclusions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=all&per_page=100" > "$RUNNER_TEMP/job-pages.json"
          node -e 'const fs=require("fs");const pages=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));fs.writeFileSync(process.argv[2],JSON.stringify({jobs:pages.flatMap(page=>page.jobs)},null,2)+"\n")' "$RUNNER_TEMP/job-pages.json" "${GITHUB_WORKSPACE}/results/github-jobs.json"

      - name: Admit the exact formal population
        if: ${{ always() && inputs.run_full_verified }}
        run: |
          node scripts/admit-generation.mjs \
            --results "${GITHUB_WORKSPACE}/results" \
            --plan "${GITHUB_WORKSPACE}/config/swe-bench-full-batches.json" \
            --corpus "${GITHUB_WORKSPACE}/results/corpora/swe-bench-verified.jsonl" \
            --recovery-manifest "${GITHUB_WORKSPACE}/results/recovery-plan/recovery-plan.json" \
            --output "${GITHUB_WORKSPACE}/results/formal-admission.json"

      - name: Upload admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swe-bench-formal-generation-evidence
          path: results/**
          if-no-files-found: error
          retention-days: 90

  swe-bench-evidence:
    name: Collect terminal benchmark evidence
    if: ${{ always() && inputs.run_swe_bench }}
    needs: [plan, smoke, corpus, isolation, swe-bench, swe-bench-recovery-plan, swe-bench-recovery, swe-bench-merge]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download admission and task evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: swe-bench-formal-generation-evidence
          path: results

      - name: Capture terminal GitHub jobs, failed steps, and logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=all&per_page=100" > "$RUNNER_TEMP/job-pages.json"
          node <<'NODE'
          const fs = require("node:fs");
          const pages = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/job-pages.json", "utf8"));
          const jobs = pages.flatMap(page => page.jobs);
          fs.writeFileSync("results/github-jobs-final.json", JSON.stringify({ jobs }, null, 2) + "\n");
          const failures = jobs
            .filter(job => job.name !== "Collect terminal benchmark evidence")
            .map(job => ({
                id: job.id,
                name: job.name,
                status: job.status,
                conclusion: job.conclusion,
                html_url: job.html_url,
                failedSteps: (job.steps ?? [])
                  .filter(step => !["success", "skipped"].includes(step.conclusion))
                  .map(step => ({ name: step.name, status: step.status, conclusion: step.conclusion })),
            }))
            .filter(job => !["success", "skipped"].includes(job.conclusion) || job.failedSteps.length > 0);
          fs.writeFileSync("results/github-failures.json", JSON.stringify({ jobs: failures }, null, 2) + "\n");
          NODE
          gh run view "$GITHUB_RUN_ID" --log-failed > results/github-failed-steps.log || true

      - name: Upload terminal acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swe-bench-terminal-evidence-${{ github.run_id }}
          path: results/**
          if-no-files-found: error
          retention-days: 90
