name: Benchmark

on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: Run the headless composition smoke gate
        required: false
        type: boolean
        default: true
      run_swe_bench:
        description: Generate frozen SWE-bench Verified predictions
        required: false
        type: boolean
        default: false
      swe_bench_limit:
        description: Number of tasks after offset (0 = all)
        required: false
        default: "1"
      swe_bench_offset:
        description: Skip the first N corpus tasks
        required: false
        default: "0"
      swe_bench_batch:
        description: Immutable diagnostic batch label
        required: false
        default: "diagnostic"
      swe_bench_tasks:
        description: Predeclared comma-separated instance IDs; overrides offset/limit
        required: false
        default: ""
      swe_bench_concurrency:
        description: Parallel model attempts
        required: false
        default: "1"
      swe_bench_model:
        description: Model override; empty uses the repository secret
        required: false
        default: ""
      swe_bench_shards:
        description: JSON shard-index array
        required: false
        default: "[0]"
      swe_bench_shard_total:
        description: Total shard count
        required: false
        default: "1"
      swe_bench_timeout:
        description: Per-task timeout in milliseconds
        required: false
        default: "1800000"

concurrency:
  group: benchmark-${{ inputs.swe_bench_batch || 'default' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BEST_AGENT_PROVIDER_KIND: ${{ secrets.BENCHMARK_PROVIDER_KIND }}
  BEST_AGENT_PROVIDER_MODEL: ${{ secrets.BENCHMARK_PROVIDER_MODEL }}
  BEST_AGENT_PROVIDER_API_KEY: ${{ secrets.BENCHMARK_PROVIDER_API_KEY }}
  BEST_AGENT_PROVIDER_BASE_URL: ${{ secrets.BENCHMARK_PROVIDER_BASE_URL }}
  BEST_AGENT_PROVIDER_COMPATIBILITY_MODE: ${{ secrets.BENCHMARK_PROVIDER_COMPATIBILITY_MODE }}

jobs:
  smoke:
    name: macOS headless smoke
    if: ${{ inputs.run_smoke || inputs.run_swe_bench }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install benchmark dependencies and the exact CLI candidate
        run: |
          npm ci
          CLI_VERSION="$(node -p 'require("./config/best-agent-candidate.json").cliVersion')"
          npm install --no-save --ignore-scripts "@best-agent/cli@${CLI_VERSION}"
          echo "BEST_AGENT_CLI_PATH=${GITHUB_WORKSPACE}/node_modules/.bin/best-agent" >> "$GITHUB_ENV"

      - name: Verify provider configuration
        run: test -n "$BEST_AGENT_PROVIDER_API_KEY"

      - name: Headless composition smoke
        run: node scripts/smoke.mjs

  swe-bench:
    name: macOS generation (shard ${{ matrix.shard }})
    if: ${{ inputs.run_swe_bench }}
    needs: smoke
    runs-on: macos-15
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.swe_bench_shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the single candidate record
        id: candidate
        run: |
          echo "commit=$(node -p 'require("./config/best-agent-candidate.json").commit')" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./config/best-agent-candidate.json").cliVersion')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: Simon-He95/best-agent
          ref: ${{ steps.candidate.outputs.commit }}
          path: tools/best-agent-source

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install benchmark dependencies and the exact CLI candidate
        run: |
          npm ci
          npm install --no-save --ignore-scripts "@best-agent/cli@${{ steps.candidate.outputs.version }}"
          echo "BEST_AGENT_SOURCE_DIR=${GITHUB_WORKSPACE}/tools/best-agent-source" >> "$GITHUB_ENV"
          echo "BEST_AGENT_CLI_PATH=${GITHUB_WORKSPACE}/node_modules/.bin/best-agent" >> "$GITHUB_ENV"
          echo "SWE_BENCH_CANDIDATE_ID=cli-${{ steps.candidate.outputs.version }}-${{ steps.candidate.outputs.commit }}" >> "$GITHUB_ENV"

      - name: Prepare pinned SWE-bench Verified corpus
        run: node scripts/prepare-swe-bench.mjs

      - name: Resolve effective model
        id: model
        run: |
          MODEL="${{ inputs.swe_bench_model }}"
          if [ -z "$MODEL" ]; then MODEL="$BEST_AGENT_PROVIDER_MODEL"; fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Relay health gate
        env:
          BEST_AGENT_PROVIDER_MODEL: ${{ steps.model.outputs.model }}
        run: node scripts/relay-health.mjs

      - name: Generate and freeze predictions
        env:
          BEST_AGENT_PROVIDER_MODEL: ${{ steps.model.outputs.model }}
          SWE_BENCH_EVALUATION_BATCH_ID: cli-${{ steps.candidate.outputs.version }}-${{ inputs.swe_bench_batch }}-${{ steps.model.outputs.model }}-shard-${{ matrix.shard }}
        run: |
          ARGS=(
            --generation-only
            --official-manifest "${GITHUB_WORKSPACE}/.tmp/official-evaluator-manifest.json"
            --corpus "${GITHUB_WORKSPACE}/results/corpora/swe-bench-verified.jsonl"
            --limit "${{ inputs.swe_bench_limit }}"
            --offset "${{ inputs.swe_bench_offset }}"
            --concurrency "${{ inputs.swe_bench_concurrency }}"
            --timeout "${{ inputs.swe_bench_timeout }}"
            --shard "${{ matrix.shard }}"
            --shard-total "${{ inputs.swe_bench_shard_total }}"
            --tag "${{ steps.model.outputs.model }}-${{ inputs.swe_bench_batch }}"
          )
          if [ -n "${{ inputs.swe_bench_tasks }}" ]; then
            ARGS+=(--tasks "${{ inputs.swe_bench_tasks }}")
          fi
          node scripts/swe-bench-harness.mjs "${ARGS[@]}"

      - name: Upload immutable generation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swe-bench-generation-${{ inputs.swe_bench_batch }}-shard-${{ matrix.shard }}
          path: |
            results/swe-bench-results.*.json
            results/swe-bench-results.*.md
            results/swe-bench-results.*.predictions/**
          if-no-files-found: error
          retention-days: 90

  swe-bench-merge:
    name: Merge deferred generation reports
    if: ${{ inputs.run_swe_bench }}
    needs: swe-bench
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the single candidate record
        id: candidate
        run: echo "commit=$(node -p 'require("./config/best-agent-candidate.json").commit')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: Simon-He95/best-agent
          ref: ${{ steps.candidate.outputs.commit }}
          path: tools/best-agent-source

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download generation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: swe-bench-generation-*
          path: results
          merge-multiple: true

      - name: Merge canonical reports
        env:
          BEST_AGENT_SOURCE_DIR: ${{ github.workspace }}/tools/best-agent-source
        run: node scripts/swe-bench-harness.mjs --merge-shards

      - name: Upload merged deferred report
        uses: actions/upload-artifact@v4
        with:
          name: swe-bench-results-deferred
          path: |
            results/swe-bench-results.json
            results/swe-bench-results.md
            results/swe-bench-results.*.predictions/**
          retention-days: 90
