name: Frontier-Harness 1.0

# Additive benchmark harness for the FrontierHarness Eval v1.0 task set
# (21 Terminal-Bench tasks + 9 DeepSWE tasks) through Pier (a Harbor fork)
# on the Docker environment of free GitHub-hosted runners. This workflow is
# completely separate from the SWE-bench `Benchmark` and Terminal-Bench 4.0
# workflows and never modifies their logic or artifacts.
#
# Candidate: exactly the terminal-bench 4.0 pattern — the private best-agent
# source repository is checked out at the pinned commit with the
# BEST_AGENT_SOURCE_TOKEN secret and the linux-x64-gnu SEA is built on the
# ubuntu-24.04 runner of this free public repository. Nothing is published.
#
# Task definitions are staged from the authoritative per-suite sources pinned
# in config/frontier-harness.json#taskSources (terminal-bench ->
# laude-institute/terminal-bench-2, datacurve -> datacurve-ai/deep-swe); the
# eval repo's tasks/ directory is public metadata without tests/.
#
# Fairness composition (frozen): one headless `best-agent run` attempt per
# predeclared task (no TUI, no interaction tools), full workspace permissions
# (unrestricted + read/write/exec), the CLI's network tool excluded, a released
# process close policy so a service a task's verifier needs outlives the agent
# phase, one frozen candidate, no evaluator output ever re-enters a model
# attempt, and the task's own verifier is the only grader. Task environments are
# internet-connected
# (the task verifiers install dependencies at trial time, matching the original
# benchmark's egress-allowlisted runtime; the agent phase of no-network tasks
# is normalized to public because the CLI needs direct provider egress). This
# matches the repo's Terminal-Bench 4.0 diagnostic composition: no closed-book
# claim is made. Results are a diagnostic self-run; they are not comparable to
# the published frontierharness.org leaderboard.
# The provider reasoning effort is one the frozen profile itself declares
# (`config/frontier-harness.json#provider.reasoningEffortOptions`, default
# `reasoningEffort`), and the materialized effort is frozen into every per-task
# record, so a run is always reported at the effort its attempts actually ran.

on:
  workflow_dispatch:
    inputs:
      fh_smoke:
        description: Run a single-task plumbing smoke (config smokeTask)
        required: false
        type: boolean
        default: false
      fh_run:
        description: Generate frozen frontier-harness predictions
        required: false
        type: boolean
        default: false
      fh_tasks:
        description: Predeclared comma-separated task ids; overrides offset/limit
        required: false
        default: ""
      fh_limit:
        description: Number of tasks after offset (0 = full corpus population)
        required: false
        default: "1"
      fh_offset:
        description: Skip the first N corpus tasks
        required: false
        default: "0"
      fh_batch:
        description: Immutable diagnostic batch label
        required: false
        default: "diagnostic"
      fh_run_full:
        description: One frozen attempt for every task in tracked batches of 10
        required: false
        type: boolean
        default: false
      fh_agent_timeout_multiplier:
        description: Multiplier over each task's declared agent timeout
        required: false
        default: "1"
      fh_reasoning_effort:
        description: Declared reasoning effort for this run (empty = the frozen config default)
        required: false
        default: ""
      fh_max_parallel:
        description: Maximum concurrent generate jobs (1-8; empty = 8)
        required: false
        default: "8"
      fh_prefix:
        description: Prompt-prefix experiment selector (A, B, C, D, E or F; empty = unchanged behaviour)
        required: false
        default: ""
      fh_filtered_egress:
        description: Keep each task's restricted agent network so Pier builds an internal network plus an allowlisting proxy; the provider is the only allowlisted domain and an in-container probe must prove the boundary first
        required: false
        type: boolean
        default: false
      fh_image_mirror:
        description: "Declared recovery delta; JSON map of a task's frozen dockerImage to a digest-pinned mirror reference (empty = unchanged)"
        required: false
        default: ""
      fh_require_clean:
        description: "Fail a Generate job whose attempt reached an answer source (upstream commits, a published build, or the hidden test corpus)"
        required: false
        type: boolean
        default: false
      fh_mirror_image:
        description: "Mirror one task image into GHCR (digest-preserving) and stop; empty = a normal generation run"
        required: false
        default: ""
      fh_mirror_repo:
        description: GHCR repository that holds mirrored task images (no tag)
        required: false
        default: "ghcr.io/simon-he95/best-agent-benchmarks/swe-bench-202605"

concurrency:
  group: frontier-harness-${{ inputs.fh_batch || 'default' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  # Read the digest-pinned task-image mirror in GHCR produced by
  # .github/workflows/fh-image-mirror.yml. It is unused, and has no effect on
  # any run, whenever fh_image_mirror is empty.
  packages: read

env:
  BENCHMARK_PROVIDER_API_KEY: ${{ secrets.BENCHMARK_PROVIDER_API_KEY }}

jobs:
  fh-candidate:
    name: Freeze current Linux candidate
    if: ${{ inputs.fh_smoke || inputs.fh_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the candidate source
        id: source
        run: |
          node -e "const c=require('./config/frontier-harness.json').cli; console.log('repository='+c.sourceRepository); console.log('commit='+c.sourceCommit)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          token: ${{ secrets.BEST_AGENT_SOURCE_TOKEN }}
          path: tools/best-agent-source
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: tools/best-agent-source/.nvmrc

      - name: Validate frontier-harness benchmark contracts
        run: node --test test/frontier-harness.test.mjs

      - name: Build the exact Linux SEA
        working-directory: tools/best-agent-source
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.commit }}"
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          pnpm pack:tui
          node --input-type=module -e 'import path from "node:path"; import { stageCliSeaPackages } from "./scripts/stage-cli-sea-packages.mjs"; stageCliSeaPackages({ artifactRoot: path.resolve(".tmp/sea"), stageRoot: path.resolve(".tmp/npm/release-stage"), targetIds: ["linux-x64-gnu"] });'

      - name: Freeze the candidate receipt
        env:
          SOURCE_REPOSITORY: ${{ steps.source.outputs.repository }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          mkdir -p results/candidate
          CLI_STAGE=tools/best-agent-source/.tmp/npm/release-stage/linux-x64-gnu
          npm install --prefix "$CLI_STAGE" --omit=dev --ignore-scripts --no-audit --no-fund
          npm ls --prefix "$CLI_STAGE" --omit=dev --all
          mkdir -p "$CLI_STAGE/runtime/bin"
          cp "$(command -v node)" "$CLI_STAGE/runtime/bin/node"
          tar czf results/candidate/best-agent-cli.tgz -C "$CLI_STAGE" .
          cp tools/best-agent-source/.tmp/sea/linux-x64-gnu/build-report.json \
            results/candidate/build-report.json
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, writeFileSync } = require("node:fs");
          const sha256 = (path) => createHash("sha256").update(readFileSync(path)).digest("hex");
          const config = require("./config/frontier-harness.json");
          const report = require("./results/candidate/build-report.json");
          const staged = require("./tools/best-agent-source/.tmp/npm/release-stage/linux-x64-gnu/package.json");
          if (
            report.artifact.target !== config.cli.target ||
            report.artifact.version !== config.cli.cliVersion ||
            staged.name !== config.cli.packageName ||
            staged.version !== config.cli.cliVersion
          ) throw new Error("Built Linux candidate does not match the frozen config.");
          const receipt = {
            schemaVersion: 1,
            packageName: staged.name,
            cliVersion: staged.version,
            sourceRepository: process.env.SOURCE_REPOSITORY,
            sourceCommit: process.env.SOURCE_COMMIT,
            target: report.artifact.target,
            lockfileSha256: sha256("tools/best-agent-source/pnpm-lock.yaml"),
            binarySha256: sha256("tools/best-agent-source/.tmp/sea/linux-x64-gnu/best-agent"),
            buildReportSha256: sha256("results/candidate/build-report.json"),
            tarballSha256: sha256("results/candidate/best-agent-cli.tgz"),
            runtimeDependencies: staged.dependencies,
            runtimeLockSha256: sha256("tools/best-agent-source/.tmp/npm/release-stage/linux-x64-gnu/package-lock.json"),
            nodeVersion: process.version,
            nodeBinarySha256: sha256("tools/best-agent-source/.tmp/npm/release-stage/linux-x64-gnu/runtime/bin/node"),
          };
          writeFileSync("results/candidate/candidate.json", JSON.stringify(receipt, null, 2) + "\n");
          NODE

      # Delivery gate: a receipt proves which bytes were built, not that the
      # delivery is usable. `pnpm pack:tui` runs the project's own build (including
      # typecheck) and smoke-tests the packages it packs, but this job ships its own
      # tarball (npm install into the stage + tar czf) which nothing starts or
      # verifies. Fail here and fh-generate never runs. The step writes one record
      # (results/candidate/delivery-verification.json) and never rewrites
      # candidate.json, whose bytes are the frozen candidateManifestSha256.
      - name: Verify the delivered candidate (typecheck, packaging, runtime)
        run: |
          node scripts/verify-frontier-harness-candidate.mjs \
            --candidate-dir results/candidate \
            --source-dir tools/best-agent-source \
            --expect-runtime

      - uses: actions/upload-artifact@v4
        with:
          name: frontier-harness-candidate-${{ github.run_id }}
          path: results/candidate
          if-no-files-found: error
          retention-days: 90

  fh-corpus:
    name: Freeze frontier-harness corpus
    if: ${{ inputs.fh_smoke || inputs.fh_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve the pinned benchmark commit
        id: benchmark
        run: |
          node -e "const c=require('./config/frontier-harness.json').source;console.log('repository='+c.sourceRepository);console.log('commit='+c.sourceCommit)" >> "$GITHUB_OUTPUT"
          node -e "const c=require('./config/frontier-harness.json').taskSources;console.log('tb_repository='+c.terminalBench.repository);console.log('tb_commit='+c.terminalBench.sourceCommit);console.log('ds_repository='+c.deepSwe.repository);console.log('ds_commit='+c.deepSwe.sourceCommit)" >> "$GITHUB_OUTPUT"

      - name: Checkout the benchmark at the pinned commit
        run: |
          set -euo pipefail
          git clone "https://github.com/${{ steps.benchmark.outputs.repository }}.git" \
            tools/frontier-harness-source
          cd tools/frontier-harness-source
          git checkout "${{ steps.benchmark.outputs.commit }}"
          test "$(git rev-parse HEAD)" = "${{ steps.benchmark.outputs.commit }}"

      - name: Checkout the per-suite task sources at the pinned commits
        run: |
          set -euo pipefail
          git clone --quiet "https://github.com/${{ steps.benchmark.outputs.tb_repository }}.git" \
            tools/terminal-bench-2-source
          cd tools/terminal-bench-2-source
          git checkout "${{ steps.benchmark.outputs.tb_commit }}"
          test "$(git rev-parse HEAD)" = "${{ steps.benchmark.outputs.tb_commit }}"
          cd "${GITHUB_WORKSPACE}"
          git clone --quiet "https://github.com/${{ steps.benchmark.outputs.ds_repository }}.git" \
            tools/deep-swe-source
          cd tools/deep-swe-source
          git checkout "${{ steps.benchmark.outputs.ds_commit }}"
          test "$(git rev-parse HEAD)" = "${{ steps.benchmark.outputs.ds_commit }}"

      - name: Freeze the task manifest
        run: |
          node scripts/prepare-frontier-harness.mjs \
            --source "${GITHUB_WORKSPACE}/tools/frontier-harness-source" \
            --terminal-bench-source "${GITHUB_WORKSPACE}/tools/terminal-bench-2-source" \
            --deep-swe-source "${GITHUB_WORKSPACE}/tools/deep-swe-source" \
            --output "${GITHUB_WORKSPACE}/results/corpora/frontier-harness-1.0.json" \
            --task-list "${GITHUB_WORKSPACE}/results/corpora/frontier-harness-1.0.tasks.txt"

      - name: Upload frozen corpus
        uses: actions/upload-artifact@v4
        with:
          name: frontier-harness-corpus-${{ github.run_id }}
          path: |
            results/corpora/frontier-harness-1.0.json
            results/corpora/frontier-harness-1.0.tasks.txt
          if-no-files-found: error
          retention-days: 7

  fh-plan:
    name: Freeze frontier-harness batches
    if: ${{ inputs.fh_smoke || inputs.fh_run }}
    needs: fh-corpus
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
      tasks: ${{ steps.tasks.outputs.tasks }}
      expected_list: ${{ steps.plan.outputs.expected_list }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the frozen corpus
        uses: actions/download-artifact@v4
        with:
          name: frontier-harness-corpus-${{ github.run_id }}
          path: results/corpora

      - name: Build bounded plan
        id: plan
        env:
          RUN_SMOKE: ${{ inputs.fh_smoke }}
          RUN_FULL: ${{ inputs.fh_run_full }}
          BATCH_LABEL: ${{ inputs.fh_batch }}
          TASK_IDS: ${{ inputs.fh_tasks }}
          TASK_LIMIT: ${{ inputs.fh_limit }}
          TASK_OFFSET: ${{ inputs.fh_offset }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const config = require("./config/frontier-harness.json");
          const manifest = JSON.parse(
            fs.readFileSync("./results/corpora/frontier-harness-1.0.json", "utf8"),
          );
          const corpus = manifest.tasks.map((task) => task.name);
          const corpusSet = new Set(corpus);
          const gpuSet = new Set(manifest.gpuTasks);
          const runSmoke = process.env.RUN_SMOKE === "true";
          const runFull = process.env.RUN_FULL === "true";
          const id = process.env.BATCH_LABEL ?? "";
          const output = (key, value) =>
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          if (runSmoke && runFull) {
            throw new Error("Select either the smoke gate or the full run, not both.");
          }
          if (runFull) {
            const plan = require("./config/frontier-harness-batches.json");
            if (
              plan.profileId !== manifest.profileId ||
              plan.datasetCommit !== manifest.dataset.sourceCommit
            ) {
              throw new Error("Tracked plan does not match the frozen corpus.");
            }
            const planned = plan.batches.flatMap((batch) => batch.tasks);
            if (
              !Number.isInteger(plan.maxBatchSize) ||
              plan.maxBatchSize < 1 ||
              plan.maxBatchSize > 10 ||
              planned.length !== corpus.length ||
              new Set(planned).size !== planned.length ||
              planned.some((name, index) => name !== corpus[index])
            ) {
              throw new Error(
                "Full plan must exact-cover the frozen corpus in corpus order.",
              );
            }
            const batches = plan.batches.map((batch) => ({
              id: batch.id,
              tasks: batch.tasks.join(","),
            }));
            output("expected_list", corpus.join(","));
            output("batches", JSON.stringify(batches));
          } else {
            const taskIds = (process.env.TASK_IDS ?? "")
              .split(",")
              .map((value) => value.trim())
              .filter(Boolean);
            const limit = Number(process.env.TASK_LIMIT);
            const offset = Number(process.env.TASK_OFFSET);
            if (!/^[a-zA-Z0-9._-]+$/.test(id)) {
              throw new Error("Batch label must be filesystem-safe.");
            }
            const preselect = runSmoke ? [config.smokeTask] : taskIds;
            const count = preselect.length || limit;
            if (!Number.isInteger(count) || count < 1 || count > 10) {
              throw new Error("Each workflow run must preselect between 1 and 10 tasks.");
            }
            if (new Set(preselect).size !== preselect.length) {
              throw new Error("Task IDs must be unique.");
            }
            for (const taskId of preselect) {
              if (!corpusSet.has(taskId)) {
                throw new Error(
                  `Predeclared task is outside the frozen corpus: ${taskId}`,
                );
              }
              if (gpuSet.has(taskId)) {
                throw new Error(
                  `Task ${taskId} requires a GPU and cannot run in the Docker environment.`,
                );
              }
            }
            if (!Number.isInteger(offset) || offset < 0 || offset + count > corpus.length) {
              throw new Error("Task offset/limit must stay inside the frozen corpus.");
            }
            const selected = preselect.length
              ? preselect
              : corpus.slice(offset, offset + count);
            output("expected_list", selected.join(","));
            output("batches", JSON.stringify([{ id, tasks: selected.join(",") }]));
          }
          NODE

      - name: Flatten per-task matrix
        id: tasks
        env:
          PLAN_BATCHES: ${{ steps.plan.outputs.batches }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const batches = JSON.parse(process.env.PLAN_BATCHES);
          const tasks = [];
          for (const batch of batches) {
            for (const name of batch.tasks.split(",")) {
              tasks.push({ task: name, batchId: batch.id });
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tasks=${JSON.stringify(tasks)}\n`);
          NODE

  fh-generate:
    name: Generate (${{ matrix.entry.task }})
    if: ${{ (inputs.fh_smoke || inputs.fh_run) && needs.fh-plan.outputs.tasks != '[]' }}
    needs: [fh-candidate, fh-corpus, fh-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.fh_max_parallel || '8') }}
      matrix:
        entry: ${{ fromJSON(needs.fh-plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the frozen current candidate
        uses: actions/download-artifact@v4
        with:
          name: frontier-harness-candidate-${{ github.run_id }}
          path: results/candidate

      - name: Resolve the single candidate record
        id: candidate
        env:
          TASK_NAME: ${{ matrix.entry.task }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const config = require("./config/frontier-harness.json");
          const cli = require("./results/candidate/candidate.json");
          const name = process.env.TASK_NAME.split("/").pop();
          console.log(`package=${cli.packageName}`);
          console.log(`version=${cli.cliVersion}`);
          console.log(`model=${config.provider.model}`);
          console.log(`benchmark_commit=${config.source.sourceCommit}`);
          console.log(`candidate_id=cli-${cli.cliVersion}-${cli.sourceCommit.slice(0, 7)}-${cli.binarySha256.slice(0, 12)}`);
          console.log(`task_short=${name}`);
          console.log(`tb_repository=${config.taskSources.terminalBench.repository}`);
          console.log(`tb_commit=${config.taskSources.terminalBench.sourceCommit}`);
          console.log(`ds_repository=${config.taskSources.deepSwe.repository}`);
          console.log(`ds_commit=${config.taskSources.deepSwe.sourceCommit}`);
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Pier with the agent plugin
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv "$RUNNER_TEMP/pier-env"
          uv pip install --python "$RUNNER_TEMP/pier-env/bin/python" \
            datacurve-pier==0.3.1 -e ./tools/frontier-harness-agent
          "$RUNNER_TEMP/pier-env/bin/pier" --version
          echo "FH_PIER_BIN=$RUNNER_TEMP/pier-env/bin/pier" >> "$GITHUB_ENV"

      - name: Download the frozen corpus
        uses: actions/download-artifact@v4
        with:
          name: frontier-harness-corpus-${{ github.run_id }}
          path: results/corpora

      - name: Checkout the single task at the pinned commit
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          git clone "https://github.com/frontier-harness-eval/eval.git" \
            tools/frontier-harness-source
          cd tools/frontier-harness-source
          git checkout "${{ steps.candidate.outputs.benchmark_commit }}"
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.benchmark_commit }}"

      - name: Checkout the per-suite task sources at the pinned commits
        run: |
          set -euo pipefail
          git clone --quiet "https://github.com/${{ steps.candidate.outputs.tb_repository }}.git" \
            tools/terminal-bench-2-source
          cd tools/terminal-bench-2-source
          git checkout "${{ steps.candidate.outputs.tb_commit }}"
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.tb_commit }}"
          cd "${GITHUB_WORKSPACE}"
          git clone --quiet "https://github.com/${{ steps.candidate.outputs.ds_repository }}.git" \
            tools/deep-swe-source
          cd tools/deep-swe-source
          git checkout "${{ steps.candidate.outputs.ds_commit }}"
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.ds_commit }}"

      - name: Verify provider credential
        run: test -n "$BENCHMARK_PROVIDER_API_KEY"

      - name: Materialize the frozen provider identity
        run: node scripts/materialize-frontier-provider.mjs "$RUNNER_TEMP/best-agent-provider" "$GITHUB_ENV" config/frontier-harness.json "${{ inputs.fh_reasoning_effort }}"

      # Declared recovery delta for a frozen task image whose public registry
      # refuses anonymous pulls (public.ecr.aws: HTTP 429 "Data limit
      # exceeded"). The image is delivered from the digest-verified GHCR mirror
      # and aliased to the pinned reference, so the task source, the harness and
      # the task's Dockerfile keep their exact bytes and only the transport that
      # delivered them changes. The step refuses to continue unless a probe
      # build proves the pinned reference resolves from that alias while the
      # source registry is blackholed, so a plumbing failure can never consume
      # the attempt it guards.
      - name: Use the mirrored task image (declared recovery delta)
        if: ${{ inputs.fh_image_mirror != '' }}
        env:
          MIRROR_SPEC: ${{ inputs.fh_image_mirror }}
          TASK_NAME: ${{ matrix.entry.task }}
        run: |
          set -euo pipefail
          MAPPING_FILE="$RUNNER_TEMP/mirror-mapping.env"
          rm -f "$MAPPING_FILE"
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const spec = JSON.parse(process.env.MIRROR_SPEC);
          const corpus = JSON.parse(
            fs.readFileSync("results/corpora/frontier-harness-1.0.json", "utf8"),
          );
          const entry = corpus.tasks.find((task) => task.name === process.env.TASK_NAME);
          const image = entry === undefined ? undefined : entry.dockerImage;
          const mirror = image === undefined ? undefined : spec[image];
          if (mirror === undefined) {
            console.log(
              `no mirror mapping for ${process.env.TASK_NAME} (${image}); the build keeps its pinned reference unchanged`,
            );
            process.exit(0);
          }
          const lines = `FH_MIRROR_SOURCE=${image}\nFH_MIRROR_REF=${mirror}\n`;
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "mirror-mapping.env"), lines);
          fs.appendFileSync(process.env.GITHUB_ENV, lines);
          console.log(`declared mirror mapping: ${image} <- ${mirror}`);
          NODE
          if [ ! -f "$MAPPING_FILE" ]; then
            exit 0
          fi
          set -a
          . "$MAPPING_FILE"
          set +a
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$FH_MIRROR_REF"
          docker tag "$FH_MIRROR_REF" "$FH_MIRROR_SOURCE"
          docker image inspect --format 'alias: {{.Id}} {{index .RepoDigests 0}}' "$FH_MIRROR_SOURCE"
          HOST="${FH_MIRROR_SOURCE%%/*}"
          sudo cp /etc/hosts "$RUNNER_TEMP/hosts.before"
          printf '127.0.0.1 %s\n127.0.0.1 registry-1.%s\n' "$HOST" "$HOST" | sudo tee -a /etc/hosts >/dev/null
          mkdir -p "$RUNNER_TEMP/alias-probe"
          printf 'FROM %s\nRUN echo alias-resolved-from-local\n' "$FH_MIRROR_SOURCE" > "$RUNNER_TEMP/alias-probe/Dockerfile"
          printf 'services:\n  main:\n    build:\n      context: .\n    pull_policy: build\n    command: [ "sh", "-c", "sleep infinity" ]\n' > "$RUNNER_TEMP/alias-probe/docker-compose.yaml"
          if ! docker compose --progress plain \
            -f "$RUNNER_TEMP/alias-probe/docker-compose.yaml" \
            --project-directory "$RUNNER_TEMP/alias-probe" build 2>&1 | tee "$RUNNER_TEMP/mirror-probe.log"; then
            sudo cp "$RUNNER_TEMP/hosts.before" /etc/hosts
            echo "the pinned reference did not resolve from the mirror alias while the source registry was blackholed; no attempt is made"
            exit 1
          fi
          sudo cp "$RUNNER_TEMP/hosts.before" /etc/hosts
          grep -q alias-resolved-from-local "$RUNNER_TEMP/mirror-probe.log"
          mkdir -p results/candidate
          node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            const inspect = execFileSync(
              "docker",
              ["image", "inspect", "--format", "{{.Id}}|{{index .RepoDigests 0}}", process.env.FH_MIRROR_SOURCE],
              { encoding: "utf8" },
            ).trim().split("|");
            fs.writeFileSync("results/candidate/image-mirror-receipt.json", JSON.stringify({
              task: process.env.TASK_NAME,
              sourceRef: process.env.FH_MIRROR_SOURCE,
              mirrorRef: process.env.FH_MIRROR_REF,
              aliasImageId: inspect[0],
              aliasRepoDigest: inspect[1],
              probe: "docker compose build resolved the pinned reference from the local mirror alias while the source registry was blackholed",
              writtenAt: new Date().toISOString(),
            }, null, 2) + "\n");
            console.log("wrote results/candidate/image-mirror-receipt.json");
          '

      - name: Generate and freeze the task attempt
        env:
          BEST_AGENT_CLI_CANDIDATE_DIR: ${{ github.workspace }}/results/candidate
          BEST_AGENT_PROVIDER_MODEL: ${{ steps.candidate.outputs.model }}
          BEST_AGENT_INSTRUCTION_PREFIX: ${{ inputs.fh_prefix }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          TASK_SHORT="${{ steps.candidate.outputs.task_short }}"
          mkdir -p "results/frontier-harness/results" "results/frontier-harness/jobs"
          node scripts/frontier-harness-harness.mjs \
            --task "${{ matrix.entry.task }}" \
            --corpus "${GITHUB_WORKSPACE}/results/corpora/frontier-harness-1.0.json" \
            --source "${GITHUB_WORKSPACE}/tools/frontier-harness-source" \
            --terminal-bench-source "${GITHUB_WORKSPACE}/tools/terminal-bench-2-source" \
            --deep-swe-source "${GITHUB_WORKSPACE}/tools/deep-swe-source" \
            --output "${GITHUB_WORKSPACE}/results/frontier-harness/results/frontier-harness-results.${TASK_SHORT}.json" \
            --jobs-dir "${GITHUB_WORKSPACE}/results/frontier-harness/jobs/${TASK_SHORT}" \
            --job-name "fh-${{ github.run_id }}-${TASK_SHORT}" \
            --model "${{ steps.candidate.outputs.model }}" \
            --agent-timeout-multiplier "${{ inputs.fh_agent_timeout_multiplier }}" \
            --candidate-id "${{ steps.candidate.outputs.candidate_id }}" \
            --batch-id "${{ matrix.entry.batchId }}" \
            --formal-run-id "${{ inputs.fh_run_full && format('formal-{0}', github.run_id) || format('diagnostic-{0}', github.run_id) }}" \
            --filtered-egress "${{ inputs.fh_filtered_egress }}"

      # A cell is only a measurement if the model solved it. This step reads the
      # attempt the previous step froze and refuses an attempt that reached an
      # answer source (the task's own upstream commits, a published build of the
      # project under test, or the hidden test corpus). It runs before upload so
      # the receipt ships with the rest of the cell's evidence.
      - name: Refuse an attempt that reached the answer
        if: always()
        env:
          REQUIRE_CLEAN: ${{ inputs.fh_require_clean }}
        run: |
          TASK_SHORT="${{ steps.candidate.outputs.task_short }}"
          JOBS="results/frontier-harness/jobs/${TASK_SHORT}"
          test -d "$JOBS" || { echo "no attempt was frozen for ${TASK_SHORT}"; exit 0; }
          if [ "$REQUIRE_CLEAN" = "true" ]; then
            node scripts/frontier-harness-contamination.mjs \
              --jobs "$JOBS" \
              --output "results/frontier-harness/results/contamination.${TASK_SHORT}.json" \
              --require-clean
          else
            node scripts/frontier-harness-contamination.mjs \
              --jobs "$JOBS" \
              --output "results/frontier-harness/results/contamination.${TASK_SHORT}.json"
          fi

      - name: Upload immutable generation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-harness-task-${{ github.run_id }}-${{ steps.candidate.outputs.task_short }}
          path: |
            results/frontier-harness/**
            results/corpora/frontier-harness-1.0.json
            results/candidate/**
          if-no-files-found: error
          retention-days: 90

  fh-report:
    name: Aggregate frontier-harness report
    if: ${{ always() && (inputs.fh_smoke || inputs.fh_run) }}
    needs: [fh-corpus, fh-plan, fh-generate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download frozen corpus
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontier-harness-corpus-${{ github.run_id }}
          path: results/corpora

      - name: Download per-task artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: frontier-harness-task-${{ github.run_id }}-*
          path: results
          merge-multiple: true

      - name: Rebuild the expected task list
        env:
          EXP_EXPLICIT: ${{ needs.fh-plan.outputs.expected_list }}
        run: |
          mkdir -p results/frontier-harness
          if [ -n "$EXP_EXPLICIT" ]; then
            echo "$EXP_EXPLICIT" | tr ',' '\n' > results/frontier-harness/expected-tasks.txt
          else
            node -e '
              const fs = require("node:fs");
              const manifest = JSON.parse(
                fs.readFileSync("results/corpora/frontier-harness-1.0.json", "utf8"),
              );
              const gpu = new Set(manifest.gpuTasks);
              const lines = manifest.tasks
                .map((t) => t.name)
                .filter((name) => !gpu.has(name))
                .join("\n");
              fs.mkdirSync("results/frontier-harness", { recursive: true });
              fs.writeFileSync("results/frontier-harness/expected-tasks.txt", lines + "\n");
            '
          fi

      - name: Build aggregate report
        run: |
          node scripts/frontier-harness-report.mjs \
            --results "${GITHUB_WORKSPACE}/results/frontier-harness/results" \
            --corpus "${GITHUB_WORKSPACE}/results/corpora/frontier-harness-1.0.json" \
            --expected-tasks "${GITHUB_WORKSPACE}/results/frontier-harness/expected-tasks.txt" \
            --output "${GITHUB_WORKSPACE}/results/frontier-harness/report.json" \
            ${{ inputs.fh_run_full && '--formal' || '' }}

      - name: Build failure analysis
        continue-on-error: true
        run: |
          node scripts/frontier-harness-failures.mjs \
            --results "${GITHUB_WORKSPACE}/results/frontier-harness/results" \
            --jobs "${GITHUB_WORKSPACE}/results/frontier-harness/jobs" \
            --output "${GITHUB_WORKSPACE}/results/frontier-harness/failures.md" \
            --json "${GITHUB_WORKSPACE}/results/frontier-harness/failures.json"

      - name: Write job summary
        run: |
          cat results/frontier-harness/report.json.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/frontier-harness/failures.md ]; then
            head -40 results/frontier-harness/failures.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload frontier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-harness-report-${{ github.run_id }}
          path: results/frontier-harness/**
          if-no-files-found: error

  # Declared recovery infrastructure for a frozen task image whose read-only
  # public registry (public.ecr.aws) refuses anonymous pulls with HTTP 429
  # "toomanyrequests: Data limit exceeded". It copies one image into GHCR with
  # its digest preserved (skopeo copy --all), then proves on a fresh runner that
  # `docker compose build` resolves the *original* FROM reference from the local
  # mirror alias while the source registry is blackholed — i.e. that the task
  # source, the harness and the task's Dockerfile keep their exact bytes and
  # only the transport that delivered them changes.
  #
  # The seed matrix runs the same copy on several fresh runners because the
  # refusal is a shared anonymous-pull quota keyed to the runner's egress IP:
  # one attempt can lose that lottery, several in parallel rarely do. Seeding is
  # idempotent, never runs a model, never grades a task and never modifies the
  # corpus, the candidate pin or any history record. Both jobs are inert
  # whenever fh_mirror_image is empty, which is the case for every run that is
  # not a declared image-mirroring recovery.
  fh-mirror:
    name: Mirror the task image into GHCR (attempt ${{ matrix.attempt }})
    if: ${{ inputs.fh_mirror_image != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Copy the image to GHCR with its digest preserved
        env:
          SRC: ${{ inputs.fh_mirror_image }}
          MIRROR_REPO: ${{ inputs.fh_mirror_repo }}
        run: |
          set -euo pipefail
          export TAG="${SRC##*:}"
          export MIRROR="$MIRROR_REPO:$TAG"
          export ATTEMPT="${{ matrix.attempt }}"
          export RUN_ID="${{ github.run_id }}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # skopeo reads this file for both the GHCR push and the mirror checks.
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          export SOURCE_DIGEST="sha256:$(skopeo inspect --raw "docker://$SRC" | sha256sum | awk '{print $1}')"
          echo "source $SRC resolves to $SOURCE_DIGEST"
          mkdir -p receipt
          # Idempotent fast path: a later attempt, or a re-dispatch, finds the
          # mirror already carrying the identical digest and stops here.
          if skopeo inspect --raw "docker://$MIRROR" >/dev/null 2>&1; then
            EXISTING_DIGEST="sha256:$(skopeo inspect --raw "docker://$MIRROR" | sha256sum | awk '{print $1}')"
            if [ "$EXISTING_DIGEST" = "$SOURCE_DIGEST" ]; then
              echo "mirror $MIRROR already carries $SOURCE_DIGEST"
              node -e '
                require("node:fs").writeFileSync("receipt/seed-receipt.json", JSON.stringify({
                  outcome: "already-present",
                  sourceRef: process.env.SRC,
                  sourceDigest: process.env.SOURCE_DIGEST,
                  mirrorRef: process.env.MIRROR,
                  mirrorDigest: process.env.SOURCE_DIGEST,
                  digestPreserved: true,
                  attempt: process.env.ATTEMPT,
                  runId: process.env.RUN_ID,
                  writtenAt: new Date().toISOString(),
                }, null, 2) + "\n");
              '
              cat receipt/seed-receipt.json
              exit 0
            fi
            echo "mirror carries $EXISTING_DIGEST, which differs from the source; re-copying"
          fi
          skopeo copy --all "docker://$SRC" "docker://$MIRROR"
          export MIRROR_DIGEST="sha256:$(skopeo inspect --raw "docker://$MIRROR" | sha256sum | awk '{print $1}')"
          echo "mirror $MIRROR resolves to $MIRROR_DIGEST"
          test "$MIRROR_DIGEST" = "$SOURCE_DIGEST"
          # Pull the mirror back by the source digest: only a digest-preserving
          # copy can satisfy this, so it is the identity proof for the record.
          docker pull "$MIRROR@$SOURCE_DIGEST"
          docker image inspect --format 'pulled {{.Id}} {{index .RepoDigests 0}}' "$MIRROR@$SOURCE_DIGEST"
          node -e '
            require("node:fs").writeFileSync("receipt/seed-receipt.json", JSON.stringify({
              outcome: "copied",
              sourceRef: process.env.SRC,
              sourceDigest: process.env.SOURCE_DIGEST,
              mirrorRef: process.env.MIRROR,
              mirrorDigest: process.env.MIRROR_DIGEST,
              digestPreserved: process.env.MIRROR_DIGEST === process.env.SOURCE_DIGEST,
              attempt: process.env.ATTEMPT,
              runId: process.env.RUN_ID,
              writtenAt: new Date().toISOString(),
            }, null, 2) + "\n");
          '
          cat receipt/seed-receipt.json

      - name: Upload the seed receipt
        if: ${{ hashFiles('receipt/seed-receipt.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fh-mirror-seed-receipt-${{ matrix.attempt }}
          path: receipt/seed-receipt.json
          if-no-files-found: error
          retention-days: 90

  fh-mirror-prove:
    name: Prove the offline local-alias build
    needs: [fh-mirror]
    if: ${{ always() && inputs.fh_mirror_image != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download every seed receipt
        uses: actions/download-artifact@v4
        with:
          pattern: fh-mirror-seed-receipt-*
          path: receipts
          merge-multiple: true

      - name: Prove docker compose build resolves the pinned reference locally
        env:
          MIRROR_REPO: ${{ inputs.fh_mirror_repo }}
        run: |
          set -euo pipefail
          export RECEIPT=""
          for candidate in receipts/seed-receipt.json receipts/*/seed-receipt.json; do
            if [ -f "$candidate" ]; then export RECEIPT="$candidate"; break; fi
          done
          if [ -z "$RECEIPT" ]; then
            echo "no seed receipt exists: every seed attempt was refused by the source registry (the anonymous-pull lottery was lost on all runners)"
            exit 1
          fi
          echo "using receipt $RECEIPT"
          cat "$RECEIPT"
          read_json() {
            node -e 'const fs=require("node:fs");console.log(JSON.parse(fs.readFileSync(process.env.RECEIPT,"utf8"))[process.argv[1]])' "$1"
          }
          export SRC="$(read_json sourceRef)"
          export DIGEST="$(read_json sourceDigest)"
          export MIRROR="$MIRROR_REPO@$DIGEST"
          export HOST="${SRC%%/*}"
          export RUN_ID="${{ github.run_id }}"
          echo "source=$SRC digest=$DIGEST host=$HOST mirror=$MIRROR"
          # 1) Blackhole the source registry: any registry contact from here on
          #    fails loudly instead of silently succeeding.
          sudo cp /etc/hosts "$RUNNER_TEMP/hosts.before"
          printf '127.0.0.1 %s\n127.0.0.1 registry-1.%s\n' "$HOST" "$HOST" | sudo tee -a /etc/hosts >/dev/null
          getent hosts "$HOST" || true
          # 2) Deliver the identical bytes from GHCR and alias them to the
          #    reference the frozen task Dockerfile pins.
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$MIRROR"
          docker tag "$MIRROR" "$SRC"
          export ALIAS_REPO_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "$SRC")"
          docker image inspect --format 'alias: {{.Id}} {{index .RepoDigests 0}}' "$SRC"
          # 3) Same shape as pier's own compose build: a plain FROM line plus
          #    pull_policy build.
          mkdir -p "$RUNNER_TEMP/alias-probe"
          printf 'FROM %s\nRUN echo alias-resolved-from-local\n' "$SRC" > "$RUNNER_TEMP/alias-probe/Dockerfile"
          printf 'services:\n  main:\n    build:\n      context: .\n    pull_policy: build\n    command: [ "sh", "-c", "sleep infinity" ]\n' > "$RUNNER_TEMP/alias-probe/docker-compose.yaml"
          docker compose --progress plain \
            -f "$RUNNER_TEMP/alias-probe/docker-compose.yaml" \
            --project-directory "$RUNNER_TEMP/alias-probe" build 2>&1 | tee "$RUNNER_TEMP/proof-build.log"
          # 4) Restore the runner's hosts file and record the proof.
          sudo cp "$RUNNER_TEMP/hosts.before" /etc/hosts
          mkdir -p proof
          node -e '
            const fs = require("node:fs");
            const log = fs.readFileSync(process.env.RUNNER_TEMP + "/proof-build.log", "utf8");
            fs.writeFileSync("proof/proof-receipt.json", JSON.stringify({
              outcome: "build-succeeded-with-source-registry-blackholed",
              sourceRef: process.env.SRC,
              sourceDigest: process.env.DIGEST,
              mirrorRef: process.env.MIRROR,
              aliasRepoDigest: process.env.ALIAS_REPO_DIGEST,
              probe: "docker compose build FROM the pinned reference, pull_policy build, source registry host blackholed in /etc/hosts",
              buildLogTail: log.split("\n").filter(Boolean).slice(-12),
              runId: process.env.RUN_ID,
              writtenAt: new Date().toISOString(),
            }, null, 2) + "\n");
          '
          cat proof/proof-receipt.json

      - name: Upload the proof receipt
        uses: actions/upload-artifact@v4
        with:
          name: fh-mirror-proof-receipt
          path: proof/proof-receipt.json
          if-no-files-found: error
          retention-days: 90
